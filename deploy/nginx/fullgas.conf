# ============================================================================
#  Fullgas B2B — configuração do Nginx (produção)
#  ---------------------------------------------------------------------------
#  Instalação e atualização:
#      sudo cp deploy/nginx/fullgas.conf /etc/nginx/sites-available/fullgas
#      sudo ln -sf /etc/nginx/sites-available/fullgas /etc/nginx/sites-enabled/fullgas
#      sudo rm -f /etc/nginx/sites-enabled/default
#      sudo nginx -t && sudo systemctl reload nginx
#
#  Este arquivo passou a ser versionado porque a configuração só existia como
#  texto dentro de docs/09-deploy-vps-linux.md — e já estava desatualizada em
#  dois pontos que quebram a produção: o `root` apontava para /var/www/fullgas
#  (o deploy.sh serve de /var/www/fullgas-app/frontend) e o bloco HTTPS tinha
#  perdido a regra de URL limpa, o que faz /portal responder 404.
#
#  ARMADILHA DO NGINX, válida para o arquivo inteiro: `add_header` dentro de um
#  bloco `location` DESCARTA todos os add_header herdados do `server`. Não é
#  acumulativo. Por isso os headers de segurança aparecem repetidos em cada
#  location — remover uma dessas repetições apaga silenciosamente a proteção
#  naquele caminho, sem nenhum erro de sintaxe para avisar.
# ============================================================================

# Esconde a versão do Nginx nas respostas e nas páginas de erro.
# (Se a diretiva já existir em /etc/nginx/nginx.conf, esta linha é redundante e
#  inofensiva; mantida aqui para a configuração ser autossuficiente.)
server_tokens off;

# ---------------------------------------------------------------------------
#  IP REAL DO CLIENTE (módulo realip)
#  ---------------------------------------------------------------------------
#  Sem este bloco, TODO pedido chega ao Nginx vindo de um IP de borda da
#  Cloudflare — e é esse IP que o Nginx repassa à API. O efeito prático é que
#  os limites de requisição (api/src/middlewares/rate-limit.js) deixam de ser
#  por cliente e passam a ser por datacenter da Cloudflare: dez tentativas de
#  login de qualquer pessoa do mundo saindo pelo mesmo POP consomem a mesma
#  cota, enquanto um atacante trocando de POP ganha uma cota nova. O limite
#  parece funcionar — ele bloqueia, aparece no log — e mesmo assim não protege
#  o que deveria.
#
#  `real_ip_recursive on` importa: o X-Forwarded-For chega com mais de um
#  endereço e sem isto o Nginx pegaria o último (a própria Cloudflare) em vez
#  de andar a lista até o primeiro que não é dela.
#
#  ATENÇÃO — a lista abaixo é a das faixas publicadas da Cloudflare e MUDA de
#  tempos em tempos. Confira em https://www.cloudflare.com/ips/ ao mexer
#  neste arquivo. Uma faixa faltando não quebra o site: aqueles pedidos apenas
#  voltam a ser contados pelo IP de borda, silenciosamente.
# ---------------------------------------------------------------------------
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# A Cloudflare põe o IP de origem neste cabeçalho. É preferível ao
# X-Forwarded-For porque ela o SOBRESCREVE sempre — um cliente que forje o
# próprio X-Forwarded-For não consegue se passar por outro endereço.
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

# ---------------------------------------------------------------------------
#  HTTP → HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name fullgas.app.br www.fullgas.app.br;
    return 301 https://$host$request_uri;
}

# ---------------------------------------------------------------------------
#  HTTPS — certificado de origem da Cloudflare (modo Full strict)
# ---------------------------------------------------------------------------
server {
    # A diretiva `http2 on;` só existe a partir do Nginx 1.25.1. Esta VPS roda
    # 1.18 (Ubuntu), onde ela é "unknown directive" e o Nginx SE RECUSA A SUBIR
    # — foi o que derrubou as recargas de 13/08. Manter a forma antiga, com o
    # http2 como parâmetro do listen, que funciona em ambas as versões.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fullgas.app.br www.fullgas.app.br;

    ssl_certificate     /etc/nginx/ssl/fullgas.pem;
    ssl_certificate_key /etc/nginx/ssl/fullgas.key;

    # O front é servido direto do repositório clonado pelo deploy.sh. Não copie
    # os arquivos para outro diretório: o deploy faz `git reset --hard` aqui, e
    # uma cópia paralela ficaria velha sem ninguém perceber.
    root /var/www/fullgas-app/frontend;
    index index.html;

    # Uploads (fotos de reivindicação, anexos de notificação) até 60 MB.
    client_max_body_size 64M;

    # =======================================================================
    #  MODO MANUTENÇÃO — para onde vão os erros de indisponibilidade
    # =======================================================================
    #  Dois gatilhos, um destino:
    #
    #  1. AUTOMÁTICO (não exige nada de ninguém): se a API cair, o proxy_pass
    #     falha e o Nginx gera 502 ou 504. Antes isto entregava a página de
    #     erro crua do Nginx; agora entrega a página da marca.
    #  2. PROGRAMADO: `sudo touch /var/www/manutencao/ATIVO` põe o site
    #     inteiro em 503; apagar o arquivo devolve o site ao ar. Não precisa
    #     de reload — o Nginx testa o arquivo a cada pedido.
    #
    #  O `error_page` é herdado pelos locations que não o redeclaram (ao
    #  contrário do add_header). /api/ e /uploads/ redeclaram para responder
    #  em JSON, que é o que o front sabe interpretar.
    #
    #  POR QUE 503 E NÃO 200: 503 é "indisponível agora, tente depois". O
    #  Google mantém a página no índice e volta mais tarde. Servir a página de
    #  manutenção com 200 diria ao buscador que ESTE é o conteúdo do site, e o
    #  portal seria reindexado como "em manutenção".
    error_page 502 503 504 @manutencao;

    # ---- URLs limpas (esconder o .html) ----
    # /index.html vira "/", e /algo.html vira /algo (301, para favoritos e
    # links antigos). O casamento é em $request_uri (a URI ORIGINAL do
    # cliente); o try_files interno abaixo NÃO altera $request_uri, então
    # servir /portal.html para o pedido /portal não dispara o redirect — sem
    # loop. NÃO REMOVA: sem isto o portal responde 404 em todas as telas.
    if ($request_uri ~ ^/index\.html) { return 301 /; }
    if ($request_uri ~ ^/([^?\s]+)\.html) { return 301 /$1; }

    # =======================================================================
    #  API — o bloco mais sensível do arquivo
    # =======================================================================
    # O `^~` é OBRIGATÓRIO aqui. Sem ele, qualquer caminho terminado em .png,
    # .jpg, .css... cai no `location ~*` de assets lá embaixo, porque no Nginx
    # regex tem precedência sobre prefixo. O pedido deixaria de ser encaminhado
    # à API e viraria busca de arquivo no disco — 404. Vale para /api/arquivos/
    # (fotos de reivindicação servidas com o nome original).
    location ^~ /api/ {
        error_page 502 503 504 @manutencao_api;

        # ---- MANUTENÇÃO PROGRAMADA ----
        # Ver o bloco "MODO MANUTENÇÃO" no topo deste server. A checagem é
        # repetida em CADA location de propósito: o `if` de nível `server`
        # roda antes da escolha do location e não deixaria a API responder
        # em JSON. Ao criar um location novo, COPIE estas duas linhas —
        # sem elas aquele caminho continua no ar durante a manutenção.
        if (-f /var/www/manutencao/ATIVO) { return 503; }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # OBRIGATÓRIO: sem este header a API acha que está em http://, e o
        # appUrl() do mail.js monta os links de recuperação de senha com
        # http:// — o usuário recebe um e-mail com link inseguro que a
        # Cloudflare vai redirecionar, quebrando tokens em alguns clientes.
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- NENHUMA RESPOSTA DE /api PODE SER CACHEADA ----
        # As respostas de autenticação carregam Set-Cookie. Uma cópia guardada
        # em qualquer camada entrega o cookie de sessão de um usuário ao
        # próximo que pedir a mesma URL — a sessão troca de dono em silêncio.
        #
        # A API já manda Cache-Control: no-store por conta própria (ver
        # api/src/server.js). Aqui o header é REMOVIDO e reescrito para
        # garantir exatamente um valor, sem duplicata, mesmo que alguém mude a
        # aplicação depois.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        # Sem efeito enquanto não houver `proxy_cache` definido, e é justamente
        # essa a intenção: se algum dia alguém ligar cache de proxy neste
        # servidor para acelerar o site, estas duas linhas já deixam /api de
        # fora por padrão, em vez de depender de quem fizer a mudança lembrar.
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        # Repetidos porque o add_header acima zerou a herança do server.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # =======================================================================
    #  Uploads públicos (catálogo) — servidos pela API
    #  O material de cliente (reivindicações, notificações, anexos dos chamados
    #  de suporte) NÃO passa por aqui:
    #  sai por /api/arquivos/..., que confere no banco de quem é o arquivo.
    # =======================================================================
    # `^~` pelo mesmo motivo do /api/ — e aqui o efeito era visível na loja:
    # TODA imagem de categoria, produto e finder retornava 404, porque o pedido
    # caía no bloco de assets e o Nginx procurava o arquivo em
    # /var/www/fullgas-app/frontend/uploads/, onde ele nunca esteve (os uploads
    # ficam em api/uploads/ e quem os serve é a API).
    location ^~ /uploads/ {
        error_page 502 503 504 @manutencao_api;

        # ---- MANUTENÇÃO PROGRAMADA ----
        # Ver o bloco "MODO MANUTENÇÃO" no topo deste server. A checagem é
        # repetida em CADA location de propósito: o `if` de nível `server`
        # roda antes da escolha do location e não deixaria a API responder
        # em JSON. Ao criar um location novo, COPIE estas duas linhas —
        # sem elas aquele caminho continua no ar durante a manutenção.
        if (-f /var/www/manutencao/ATIVO) { return 503; }

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nosniff é crítico AQUI: são arquivos enviados por usuários. Sem ele o
        # navegador "adivinha" o tipo e pode executar como HTML algo que foi
        # salvo com extensão de imagem.
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    }

    # =======================================================================
    #  Assets versionados (?v=AAAAMMDDx) — cache longo é seguro
    # =======================================================================
    location ~* \.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        # ---- MANUTENÇÃO PROGRAMADA ----
        # Ver o bloco "MODO MANUTENÇÃO" no topo deste server. A checagem é
        # repetida em CADA location de propósito: o `if` de nível `server`
        # roda antes da escolha do location e não deixaria a API responder
        # em JSON. Ao criar um location novo, COPIE estas duas linhas —
        # sem elas aquele caminho continua no ar durante a manutenção.
        if (-f /var/www/manutencao/ATIVO) { return 503; }

        expires 30d;

        # SEM `always` de propósito. Com ele, o cache de 30 dias era carimbado
        # também nas respostas de ERRO — e foi assim que a Cloudflare guardou
        # por 30 dias o 404 das imagens de /uploads/ (bug do `location` sem
        # `^~`). Consertar o Nginx não bastava: o 404 continuava vindo do cache.
        # Sem `always`, o cabeçalho só vai em resposta bem-sucedida, e um erro
        # futuro se corrige sozinho assim que a origem volta ao normal.
        add_header Cache-Control "public, max-age=2592000";

        # Este mantém o `always`: cabeçalho de segurança deve valer inclusive
        # nas páginas de erro.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # =======================================================================
    #  Páginas (HTML) — o resto
    # =======================================================================
    location / {
        # ---- MANUTENÇÃO PROGRAMADA ----
        # Ver o bloco "MODO MANUTENÇÃO" no topo deste server. A checagem é
        # repetida em CADA location de propósito: o `if` de nível `server`
        # roda antes da escolha do location e não deixaria a API responder
        # em JSON. Ao criar um location novo, COPIE estas duas linhas —
        # sem elas aquele caminho continua no ar durante a manutenção.
        if (-f /var/www/manutencao/ATIVO) { return 503; }

        try_files $uri $uri.html $uri/ =404;

        # As PÁGINAS não podem ficar presas no cache, e isto é o par necessário
        # do ?v= dos assets: o ?v= força o navegador a buscar o JS novo, mas
        # quem diz qual ?v= usar é o HTML. Com o HTML velho em cache, o usuário
        # roda a versão antiga inteira sem saber — foi exatamente o que
        # aconteceu num teste local, com o Chrome servindo HTML velho depois de
        # um deploy. "no-cache" não proíbe guardar: obriga a revalidar antes de
        # usar, o que mantém o 304 barato e o conteúdo sempre correto.
        add_header Cache-Control "no-cache" always;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # ---- Content-Security-Policy ----
        # O front não tem NENHUM <script> inline nem handler inline (onclick=,
        # data-callback=), e é isso que torna `script-src 'self'` viável sem
        # 'unsafe-inline'. Manter essa propriedade ao escrever tela nova é o que
        # mantém esta linha de pé.
        #
        # Por diretiva:
        #   style-src 'unsafe-inline'  — inevitável hoje: o front gera centenas
        #       de atributos style= via innerHTML. Remover exige refatorar isso.
        #   img-src/media-src blob:    — OBRIGATÓRIO. As fotos protegidas são
        #       baixadas por fetch e viram URL de blob (api-adapter.js). Sem
        #       blob:, toda foto de reivindicação some da tela.
        #   img-src anexos.tiny.com.br + s3.amazonaws.com/tiny-anexos-us/ —
        #       a foto do produto importado do Tiny NÃO é copiada para cá: o
        #       banco guarda a URL do próprio Tiny (Produto.ImagemUrl) e o
        #       navegador busca lá. São DOIS domínios: o Tiny distribui os
        #       anexos entre o servidor dele e um bucket S3, sem critério
        #       visível (hoje: 20 produtos num, 24 no outro). Liberar só um
        #       deixa metade da loja sem foto — foi o que aconteceu em 13/08.
        #       O S3 vai com o CAMINHO do bucket, não só o host: `https://
        #       s3.amazonaws.com` sozinho autorizaria QUALQUER bucket de
        #       QUALQUER pessoa a servir imagem aqui. Com a barra final, o
        #       casamento é por prefixo e só o bucket do Tiny passa.
        #       ATENÇÃO: se um produto novo aparecer sem foto na loja, o
        #       primeiro suspeito é o Tiny ter passado a usar um terceiro
        #       endereço — confira com:
        #         SELECT DISTINCT LEFT(ImagemUrl, 40) FROM dbo.Produto
        #          WHERE ImagemUrl LIKE 'http%';
        #   connect-src viacep        — consulta de CEP no cadastro.
        #   challenges.cloudflare.com — a caixa anti-robô da tela de acesso.
        #   frame-ancestors 'none'    — o equivalente moderno do X-Frame-Options.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; connect-src 'self' https://viacep.com.br https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://anexos.tiny.com.br https://s3.amazonaws.com/tiny-anexos-us/; media-src 'self' blob:; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    }

    # =======================================================================
    #  DESTINOS DO MODO MANUTENÇÃO (locations nomeadas)
    #  ---------------------------------------------------------------------
    #  `internal` NÃO é usado aqui porque location nomeada (@) já é
    #  inalcançável de fora: não existe URL que case com ela.
    # =======================================================================

    # ---- Páginas: a página da marca ----
    location @manutencao {
        # Diretório PRÓPRIO, fora de /var/www/fullgas-app. Isto é essencial: o
        # deploy.sh roda `git reset --hard` no repositório, e a página de
        # manutenção precisa continuar existindo exatamente quando um deploy
        # está no meio do caminho — que é o momento mais provável de o site
        # estar fora do ar. A fonte versionada dela é deploy/manutencao/.
        root /var/www/manutencao;
        rewrite ^ /index.html break;

        # O 503 do error_page é preservado (não vira 200), e é isso que
        # queremos: ver a explicação no bloco do topo.

        # ---- no-store é a linha MAIS IMPORTANTE deste bloco ----
        # Em 13/08 a Cloudflare guardou um 404 com max-age de 30 dias e o site
        # seguiu quebrado para os visitantes mesmo depois do Nginx corrigido.
        # Um 503 cacheado tem o mesmo efeito, e pior: o site VOLTA ao ar e o
        # cliente continua vendo "em manutenção", sem nada de errado no
        # servidor para investigar.
        add_header Cache-Control "no-store, must-revalidate" always;

        # Diz ao navegador e ao buscador em quantos segundos vale a pena tentar
        # de novo. É o par do <meta refresh> de 60s que existe na página.
        add_header Retry-After 60 always;

        # Repetidos porque os add_header acima zeraram a herança do server
        # (a armadilha descrita no topo do arquivo).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

        # CSP mínima: a página é autossuficiente (todo o CSS está embutido nela
        # e não há script nenhum). `style-src 'unsafe-inline'` cobre a tag
        # <style> do arquivo; nada mais precisa ser liberado.
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    }

    # ---- API e uploads: JSON, não HTML ----
    # Quem chama /api é o fetch() do front, que faz response.json(). Entregar
    # a página HTML de manutenção aqui provocaria um erro de parse e uma tela
    # quebrada em vez de uma mensagem clara. O front trata corpo de erro com
    # a chave `erro` (ver frontend/js/api-adapter.js).
    location @manutencao_api {
        default_type application/json;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Retry-After 60 always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        return 503 '{"erro":"O portal esta em manutencao. Tente novamente em instantes."}';
    }
}
