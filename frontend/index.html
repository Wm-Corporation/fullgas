<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FULLGAS B2B — Acesso</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=20260722d">
  <link rel="apple-touch-icon" href="img/favicon.png?v=20260722d">
  <link rel="stylesheet" href="css/styles.css?v=20260916b">
</head>
<body data-cache="">
  <div class="auth-wrap">
    <div class="auth-card">
      <div class="head">
        <span class="brand big"><span class="g-badge" id="logo-f">F</span> FULLGAS</span>
        <div class="sub">Portal B2B do concessionário</div>
        <div class="auth-tabs">
          <button id="tab-login" class="on" type="button">Entrar</button>
          <button id="tab-cad" type="button">Cadastrar</button>
        </div>
      </div>

      <div class="auth-body">
        <p id="auth-msg" class="auth-msg"></p>

        <!-- LOGIN -->
        <div id="form-login">
          <div class="field">
            <label for="lg-email">E-mail</label>
            <input id="lg-email" type="email" autocomplete="username" placeholder="voce@suaempresa.com.br">
          </div>
          <div class="field">
            <label for="lg-senha">Senha</label>
            <input id="lg-senha" type="password" autocomplete="current-password" placeholder="••••••••">
          </div>
          <!-- Verificação anti-robô, ANTES do botão de entrar: a ordem visual
               importa, porque o usuário precisa marcar a caixa antes de
               clicar. Fica vazia e escondida até o auth.js confirmar que há
               chave configurada no servidor (GET /api/auth/captcha/config) e
               o widget ser desenhado aqui dentro. Sem configuração, nada
               disto aparece e o login segue funcionando — é o que mantém o
               desenvolvimento local simples. -->
          <div id="captcha-bloco" class="hidden" style="margin:14px 0;">
            <div id="captcha-widget" style="display:flex;justify-content:center;"></div>
          </div>

          <button class="btn red" id="btn-login" type="button" style="width:100%;justify-content:center;">Entrar no portal</button>

          <p style="margin:12px 0 0;text-align:center;">
            <button class="link-btn" id="lk-esqueci" type="button">Esqueci minha senha</button>
          </p>
        </div>

        <!-- ESQUECI MINHA SENHA — pede o e-mail cadastrado e manda o link -->
        <div id="form-esq" class="hidden">
          <p class="muted" style="font-size:13px;margin-top:0;">
            Informe o e-mail cadastrado. Enviaremos um link para você criar uma senha nova.
          </p>
          <div class="field">
            <label for="es-email">E-mail cadastrado</label>
            <input id="es-email" type="email" autocomplete="username" placeholder="voce@suaempresa.com.br">
          </div>
          <button class="btn red" id="btn-esq" type="button" style="width:100%;justify-content:center;">Enviar link de recuperação</button>
          <p style="margin:12px 0 0;text-align:center;">
            <button class="link-btn" id="lk-voltar-login" type="button">← Voltar para o login</button>
          </p>
        </div>

        <!-- CADASTRO -->
        <div id="form-cad" class="hidden">
          <div class="field">
            <label for="cd-nome">Nome completo</label>
            <input id="cd-nome" type="text" placeholder="Seu nome">
          </div>
          <div class="field">
            <label for="cd-empresa">Empresa / Razão social</label>
            <input id="cd-empresa" type="text" placeholder="Nome da concessionária">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="cd-cnpj">CNPJ</label>
              <input id="cd-cnpj" type="text" inputmode="numeric" maxlength="18" placeholder="00.000.000/0000-00">
            </div>
            <div class="field">
              <label for="cd-ie">Inscrição estadual <span class="muted">(opcional)</span></label>
              <input id="cd-ie" type="text" maxlength="20" placeholder="000.000.000.000 ou ISENTO">
            </div>
          </div>
          <div class="field-row">
            <div class="field">
              <label for="cd-telefone">Telefone</label>
              <input id="cd-telefone" type="text" inputmode="tel" placeholder="(00) 00000-0000">
            </div>
            <div class="field">
              <label for="cd-email">E-mail</label>
              <input id="cd-email" type="email" placeholder="voce@suaempresa.com.br">
            </div>
          </div>
          <div class="field">
            <label for="cd-senha">Senha</label>
            <input id="cd-senha" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
          </div>

          <div class="field-title">Endereço da empresa</div>
          <div class="field-row">
            <div class="field" style="flex:0 0 40%;">
              <label for="cd-cep">CEP</label>
              <input id="cd-cep" type="text" inputmode="numeric" maxlength="9" placeholder="00000-000">
            </div>
            <div class="field">
              <label for="cd-logradouro">Logradouro</label>
              <input id="cd-logradouro" type="text" placeholder="Rua / Avenida">
            </div>
          </div>
          <div class="field-row">
            <div class="field" style="flex:0 0 30%;">
              <label for="cd-numero">Número</label>
              <input id="cd-numero" type="text" placeholder="123">
            </div>
            <div class="field">
              <label for="cd-complemento">Complemento</label>
              <input id="cd-complemento" type="text" placeholder="Sala, bloco (opcional)">
            </div>
          </div>
          <div class="field">
            <label for="cd-bairro">Bairro</label>
            <input id="cd-bairro" type="text" placeholder="Bairro">
          </div>
          <div class="field-row">
            <div class="field">
              <label for="cd-cidade">Cidade</label>
              <input id="cd-cidade" type="text" placeholder="Cidade">
            </div>
            <div class="field" style="flex:0 0 90px;">
              <label for="cd-uf">UF</label>
              <input id="cd-uf" type="text" maxlength="2" placeholder="SP" style="text-transform:uppercase;">
            </div>
          </div>

          <!-- Mesma verificação anti-robô do login, e pelo mesmo motivo: sem
               ela, o cadastro é um formulário público que cria empresa +
               usuário no banco e ainda dispara uma chamada ao Tiny. É um
               SEGUNDO widget, não o do login reaproveitado: o token do
               Turnstile vale uma vez só, e um widget escondido (o formulário
               de login fica display:none aqui) não renderiza. -->
          <div id="captcha-bloco-cad" class="hidden" style="margin:14px 0;">
            <div id="captcha-widget-cad" style="display:flex;justify-content:center;"></div>
          </div>

          <button class="btn red" id="btn-cad" type="button" style="width:100%;justify-content:center;">Enviar cadastro para aprovação</button>
          <p class="muted" style="font-size:12px;margin-top:10px;">Novos cadastros entram como <b>cliente</b> e precisam ser aprovados por um administrador antes do primeiro acesso.</p>
        </div>
      </div>
    </div>

    <!-- Aqui existia um quadro "Acessos de demonstração" com e-mail e senha das
         contas de teste. Saiu na preparação para produção: ficava visível para
         qualquer visitante da tela de acesso, entregando contas válidas e o
         padrão de senha da casa. As credenciais de teste vivem no
         database/fullgas_seeds.sql, que não é aplicado em produção. -->
  </div>

  <!-- EASTER EGG — clicar no "F" do logo abre este vídeo. Sem pista visual
       nenhuma de propósito (nada de cursor:pointer, nada de título "clique
       aqui"): é para ser achado, não anunciado. Ver #logo-f em js/auth.js. -->
  <div id="egg-back" class="egg-back hidden">
    <div class="egg-box">
      <button class="egg-x" id="egg-x" type="button" aria-label="Fechar">×</button>
      <video id="egg-video" class="egg-video" playsinline controls>
        <source src="media/easter-egg-f.mp4?v=20260915a" type="video/mp4">
      </video>
    </div>
  </div>

  <script src="js/config.js?v=20260727a"></script>
  <script src="js/store.js?v=20260916a"></script>
  <script src="js/api-adapter.js?v=20260917a"></script>
  <script src="js/auth.js?v=20260915a"></script>
</body>
</html>
