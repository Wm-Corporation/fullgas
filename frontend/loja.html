<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullgas — Loja do revendedor</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=20261028a">
  <link rel="apple-touch-icon" href="img/favicon.png?v=20261028a">
  <link rel="stylesheet" href="css/styles.css?v=20261029b">
</head>
<body data-cache="products categories models orders">

  <!-- ====== cabeçalho: marca, menu, busca e atalhos ====== -->
  <header class="shop-head">
    <div class="sh-linha">
      <div class="sh-marca">
        <a href="/portal" class="sh-title" title="Sair da loja e voltar ao portal">FULLGAS Loja</a>
        <div class="sh-user" id="sh-user"></div>
      </div>
      <button class="menu-btn" id="menu-btn" type="button" aria-label="Abrir o menu" aria-expanded="false" aria-controls="shop-drawer">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        <span class="mb-txt">MENU</span>
      </button>

      <form class="sh-search" id="sh-search">
        <input id="sh-q" type="search" placeholder="Buscar peça por nome ou código" aria-label="Buscar peça por nome ou código" autocomplete="off">
        <button type="submit" aria-label="Buscar"><svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.6"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg></button>
      </form>

      <nav class="sh-acoes" aria-label="Atalhos">
        <a class="sh-acao" href="#/quick-order" data-rota="quick-order"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg><span>Pedido rápido</span></a>
        <a class="sh-acao" href="#/pedidos" data-rota="pedidos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Meus pedidos</span></a>
        <a class="sh-acao sh-cart" href="#/carrinho" data-rota="carrinho" aria-label="Carrinho"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.3M9 20h.01M17 20h.01"/></svg><span>Carrinho</span><b class="cart-n" id="cart-n">0</b></a>
      </nav>
    </div>

  </header>

  <!-- Menu lateral (aberto pelo botão MENU) -->
  <div class="drawer-back" id="drawer-back" hidden></div>
  <aside class="shop-drawer" id="shop-drawer" aria-label="Menu da loja" hidden></aside>

  <!-- ====== faixa de página ====== -->
  <div class="page-band">
    <div class="bc" id="page-bc"><a href="#/">LOJA</a></div>
    <div class="title" id="page-title">CATEGORIAS</div>
  </div>

  <main class="shop" id="view"></main>

  <!-- Carrinho flutuante -->
  <a href="#/carrinho" class="cart-fab" id="cart-fab" title="Ver carrinho" aria-label="Ver carrinho">
    <svg class="cart-fab-ico" viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M3 4h2l2.4 11h10.2L20 8H6.3M9 20h.01M17 20h.01"/></svg>
    <span class="cart-n" id="cart-fab-n">0</span>
  </a>

  <script src="js/config.js?v=20260727a"></script>
  <script src="js/store.js?v=20261027c"></script>
  <script src="js/api-adapter.js?v=20261027d"></script>
  <script src="js/ao-vivo.js?v=20260831a"></script>
  <script src="js/shop.js?v=20261029b"></script>
  <script src="js/suporte.js?v=20260831a"></script>
</body>
</html>
