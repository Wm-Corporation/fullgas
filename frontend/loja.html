<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullgas Dealer Shop</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=20260722d">
  <link rel="apple-touch-icon" href="img/favicon.png?v=20260722d">
  <link rel="stylesheet" href="css/styles.css?v=20260916b">
</head>
<body data-cache="products categories models orders">

  <!-- ====== cabeçalho vermelho ====== -->
  <header class="shop-head">
    <div>
      <a href="/portal" class="sh-title" title="Sair da loja e voltar ao portal" style="display:inline-block;text-decoration:none;color:var(--ink);">FULLGAS Dealer Shop</a>
      <div class="sh-user" id="sh-user"></div>
    </div>

    <button class="menu-btn" id="menu-btn" type="button"><span id="menu-x">☰</span> MENU</button>
    <nav class="shop-mega" id="shop-mega"></nav>

    <a class="pf-link" href="/finder" style="font-size:11px;font-weight:700;line-height:1.2;">
      🔍 SPARE<br>PARTS<br>FINDER
    </a>

    <form class="sh-search" id="sh-search">
      <input id="sh-q" type="text" placeholder="Buscar artigos...">
      <button type="submit" aria-label="Buscar">🔍</button>
    </form>

    <div class="sh-icons">
      <a href="#/carrinho" title="Carrinho">🛒<span class="cart-n" id="cart-n">0</span></a>
      <a href="#/quick-order" title="Quick Order">⚡</a>
      <a href="#/pedidos" title="Histórico de pedidos">🧾</a>
      <!-- Sem seta de voltar aqui: o VOLTAR padrão fica na faixa da página
           (e o logo FULLGAS ao lado já leva ao portal). -->
      <a class="sh-brand" href="/portal" title="Voltar ao portal" style="text-decoration:none;display:inline-flex;align-items:center;"><img src="img/Fullgas_logo003.png?v=20260730a" alt="FULLGAS" style="height:28px;width:auto;display:block;"></a>
    </div>
  </header>

  <!-- ====== faixa de página ====== -->
  <div class="page-band">
    <div class="bc" id="page-bc"><a href="#/">LOJA</a></div>
    <div class="title" id="page-title">CATEGORIAS</div>
  </div>

  <main class="shop" id="view"></main>

  <!-- Carrinho flutuante (canto inferior direito) — atalho sempre visível
       para a cesta, além do ícone no cabeçalho. -->
  <a href="#/carrinho" class="cart-fab" id="cart-fab" title="Ver carrinho" aria-label="Ver carrinho">
    <span class="cart-fab-ico">🛒</span>
    <span class="cart-n" id="cart-fab-n">0</span>
  </a>

  <script src="js/config.js?v=20260727a"></script>
  <script src="js/store.js?v=20260916a"></script>
  <script src="js/api-adapter.js?v=20260917a"></script>
  <script src="js/ao-vivo.js?v=20260831a"></script>
  <script src="js/shop.js?v=20260916a"></script>
  <script src="js/suporte.js?v=20260831a"></script>
</body>
</html>
