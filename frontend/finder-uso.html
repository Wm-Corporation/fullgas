<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fullgas — Onde a peça é usada</title>
  <link rel="icon" type="image/png" href="img/favicon.png?v=20261028a">
  <link rel="apple-touch-icon" href="img/favicon.png?v=20261028a">
  <link rel="stylesheet" href="css/styles.css?v=20261029c">
</head>
<body class="fd-marca" data-cache="">

  <div class="finder-top">
    <!-- Fundo da faixa (padrão + símbolo) num irmão com overflow próprio: não afeta sticky. -->
    <div class="fd-deco" aria-hidden="true"></div>
    <div class="fd-hero-txt">
      <button class="btn-voltar" id="uso-voltar" type="button">Voltar</button>
      <div class="fd-eyebrow">Localizador de Peças</div>
      <h1>Onde a peça é usada</h1>
      <p class="fd-sub">Digite o código ou a descrição e veja em quais modelos e seções a peça aparece.</p>
      <div class="who" id="uso-who"></div>
    </div>
    <div class="finder-top-right">
      <a class="fd-cart" href="/loja#/carrinho" title="Ir ao carrinho da loja">🛒<span class="cart-n" id="uso-cart-n">0</span></a>
      <a class="fd-logo" href="/portal" title="Voltar ao portal"><img src="img/logo-fullgas-marca.png?v=20261028a" alt="FULLGAS"></a>
      <a class="usage-btn" href="/finder">‹ Voltar ao Localizador</a>
    </div>
  </div>

  <main class="finder">
    <div class="usage-page">
      <!-- Coluna esquerda: filtros de busca por número do artigo / descrição. -->
      <aside class="usage-filtros fd-card">
        <label for="uso-sku">Código da peça</label>
        <input id="uso-sku" type="text" placeholder="Ex.: A46003053000">

        <label for="uso-desc" style="margin-top:12px;">Descrição da peça</label>
        <input id="uso-desc" type="text" placeholder="">

        <button class="btn fd-btn-buscar" id="uso-search" type="button" style="margin-top:16px;">Buscar</button>
      </aside>

      <!-- Resultado: todas as seções que possuem aquele SKU anexado. -->
      <section class="usage-result fd-card">
        <div class="usage-result-head">
          <h2 id="uso-titulo">Busca:</h2>
          <div class="usage-quick">
            <input id="uso-quick" type="text" placeholder="Filtrar resultado…">
          </div>
        </div>
        <div id="uso-tabela"></div>
      </section>
    </div>
  </main>

  <script src="js/config.js?v=20260730a"></script>
  <script src="js/store.js?v=20261027c"></script>
  <script src="js/api-adapter.js?v=20261027d"></script>
  <script src="js/ao-vivo.js?v=20260831a"></script>
  <script src="js/finder-uso.js?v=20261001b"></script>
  <script src="js/suporte.js?v=20260831a"></script>
</body>
</html>
